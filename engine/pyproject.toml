[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "padel-engine"
version = "0.1.0"
description = "Motor de análisis de vídeo de pádel: detección, seguimiento, métricas en pista e informe"
requires-python = ">=3.11"
license = { text = "Propietario" }
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "anthropic>=2.3",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Detector YOLO para prototipar. ⚠️ AGPL-3.0: ver docs/DECISIONES.md antes de usarlo en producción.
yolo = ["ultralytics>=8.3"]
# Detector alternativo con licencia BSD (uso comercial sin restricciones).
torchvision = ["torch>=2.2", "torchvision>=0.17"]
dev = ["pytest>=8"]

[project.scripts]
padel-engine = "padel_engine.cli:main"

[tool.setuptools.packages.find]
include = ["padel_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
